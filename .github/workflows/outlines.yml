name: Circuit outlines from OpenStreetMap
# On demand: fetches the mapped track for every MotoGP / WorldSBK circuit that has no outline yet, writes it into
# src/bikes/assets_<sport>.json (osm), checks the build, commits, deploys.
# What was found and what was not — with the reason — is printed on the run's summary page.
# © OpenStreetMap contributors, ODbL.
on:
  workflow_dispatch:
    inputs:
      sport: { description: 'motogp, sbk, or both (space-separated)', required: true, default: 'motogp sbk' }
      minutes: { description: 'stop after this many minutes, keeping what was found', required: false, default: '100' }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: sweep, cancel-in-progress: false }
jobs:
  outlines:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # the script stops itself at 100 minutes and keeps what it found; run again for the rest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Fetch outlines
        env: { OUTLINES_MINUTES: '${{ inputs.minutes }}' }
        run: python tools/osm_outlines.py ${{ inputs.sport }}
      - name: Anything new?
        id: diff
        run: |
          if git diff --quiet -- src/bikes; then echo "changed=false" >> $GITHUB_OUTPUT; echo "no new outlines"; else echo "changed=true" >> $GITHUB_OUTPUT; fi
      - name: Rebuild and check
        if: steps.diff.outputs.changed == 'true'
        run: |
          python build.py
          python tools/check_links.py
      - name: Commit
        id: commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "apex-sweeper"; git config user.email "sweeper@users.noreply.github.com"
          git add src/bikes
          git commit -m "outlines: ${{ inputs.sport }} from OpenStreetMap"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT
  deploy:
    needs: outlines
    if: needs.outlines.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions: { contents: read, pages: write, id-token: write }
