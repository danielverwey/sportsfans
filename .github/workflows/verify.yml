name: Verify in a browser
# Weekly and on demand: serves docs/ and drives every atlas headless (all seasons × tabs × eras, phone width, deep links, offline editions).
on:
  schedule: [{ cron: '30 7 * * 1' }]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python build.py   # docs/data and docs/downloads are not committed
      - run: npm install playwright@1.47 && npx playwright install --with-deps chromium
      - run: node tools/check_site.js
