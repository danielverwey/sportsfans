name: Sweep · UFC
# Cards are on Saturday nights (US time); Sunday afternoon UTC the event article has its results; Tuesday catches corrections.
# Times are UTC. Run workflow by hand any time; tick "dry run" to read and report without committing.
on:
  schedule:
    - cron: '13 13 * * 0,2'
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Read and report only, commit nothing', type: boolean, default: false }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: sweep-ufc, cancel-in-progress: false }   # one group per atlas: GitHub keeps only one pending run per group, so a shared group would cancel sweeps that overlap
jobs:
  sweep:
    uses: ./.github/workflows/sweep-run.yml
    with:
      sport: ufc
      dry_run: ${{ inputs.dry_run == true }}
    permissions: { contents: write }
  deploy:
    needs: sweep
    if: needs.sweep.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions: { contents: read, pages: write, id-token: write }
