name: Build and deploy
# Rebuilds docs/ from src/ + data/, refuses if the committed docs/ drifted, checks every internal link,
# then publishes docs/ to GitHub Pages (Settings → Pages → Source: GitHub Actions).
on:
  push: { branches: [main] }
  workflow_dispatch:
  workflow_call:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - name: Rebuild and confirm nothing drifts
        run: |
          python build.py
          git diff --exit-code --stat -- docs || (echo "docs/ is out of date: run python build.py and commit" && exit 1)
      - name: Every internal link resolves
        run: python tools/check_links.py
      - uses: actions/upload-pages-artifact@v5
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
