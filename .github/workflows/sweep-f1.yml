name: Sweep · Formula 1
# Grands Prix are on Sundays; Jolpica has the results by Monday morning; Wednesday catches stewards' corrections. March to December.
# Times are UTC. Run workflow by hand any time; tick "dry run" to read and report without committing.
on:
  schedule:
    - cron: '17 6 * 3-12 1,3'
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Read and report only, commit nothing', type: boolean, default: false }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: sweep-f1, cancel-in-progress: false }   # one group per atlas: GitHub keeps only one pending run per group, so a shared group would cancel sweeps that overlap
jobs:
  sweep:
    uses: ./.github/workflows/sweep-run.yml
    with:
      sport: f1
      dry_run: ${{ inputs.dry_run == true }}
    permissions: { contents: write }
  deploy:
    needs: sweep
    if: needs.sweep.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions: { contents: read, pages: write, id-token: write }
