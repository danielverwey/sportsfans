name: Sweep · Dakar Rally
# The rally runs through the first half of January; daily from 3 to 31 January.
# Times are UTC. Run workflow by hand any time; tick "dry run" to read and report without committing.
on:
  schedule:
    - cron: '3 10 3-31 1 *'
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Read and report only, commit nothing', type: boolean, default: false }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: sweep, cancel-in-progress: false }
jobs:
  sweep:
    uses: ./.github/workflows/sweep-run.yml
    with:
      sport: dakar
      dry_run: ${{ inputs.dry_run == true }}
    permissions: { contents: write }
  deploy:
    needs: sweep
    if: needs.sweep.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions: { contents: read, pages: write, id-token: write }
