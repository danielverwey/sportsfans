name: Sweep debug · TT reader
# Temporary: prints what the TT reader sees in the 2025 article next to what the archive holds. Removed before merge.
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install --quiet beautifulsoup4 lxml
      - run: |
          python - <<'PY'
          import sys, json, re
          sys.path.insert(0, 'tools'); sys.path.insert(0, 'tools/harvest'); sys.path.insert(0, 'tools/sweepers')
          from wiki import parse_page, grid, text
          import tt
          page = parse_page('2025 Isle of Man TT'); print('page', page.title, page.revid)
          for t in page.soup.find_all('table', class_=re.compile('wikitable'))[:12]:
              m = grid(t)
              if not m: continue
              print('TABLE headers:', [text(c) for c in m[0]][:9])
              for row in m[1:3]: print('   row:', [text(c)[:28] for c in row][:9], '| names:', tt.names_of(row[2]) if len(row) > 2 else None)
          page, races = tt.read_year(2025, lambda title: page)
          A = json.load(open('data/tt.json', encoding='utf-8')); new_riders = {}
          mine = {r['id']: r for r in tt.build(2025, races, A['riders'], page.url, new_riders)}
          for r in A['races']:
              if r['y'] != 2025: continue
              print('ARCHIVE', r['id'], [(x[1], x[0], x[3]) for x in r['results'][:3]])
              print('READER ', r['id'], [(x[1], x[0], x[3]) for x in mine.get(r['id'], {}).get('results', [])[:3]])
          print('new riders:', list(new_riders.items())[:8])
          PY
